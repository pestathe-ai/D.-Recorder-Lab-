name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODELS_DIR: /tmp/models

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Prepare models
        run: |
          mkdir -p "$MODELS_DIR"
          cd "$MODELS_DIR"
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          curl -sSfL -o silero_vad.onnx "$B/silero_vad.onnx"
          for m in base small; do
            curl -sSfL -o "$m.tbz" "$B/sherpa-onnx-whisper-$m.tar.bz2"
            tar xjf "$m.tbz"
            D="sherpa-onnx-whisper-$m"
            mv "$D/$m-encoder.int8.onnx" "whisper-$m-encoder.int8.onnx"
            mv "$D/$m-decoder.int8.onnx" "whisper-$m-decoder.int8.onnx"
            mv "$D/$m-tokens.txt" "whisper-$m-tokens.txt"
            rm -rf "$D" "$m.tbz"
          done
          ls -l

      # I modelli vengono pubblicati una volta sola come file singoli:
      # il telefono scarica solo ciò che serve e può riprendere il download.
      - name: Publish models
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: Modelli di trascrizione
          body: Modelli Whisper (OpenAI, licenza MIT) convertiti da sherpa-onnx e Silero VAD (MIT).
          overwrite_files: false
          files: /tmp/models/*

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup platforms
        run: |
          chmod +x tool/setup_platforms.sh
          set -o pipefail
          if ! ./tool/setup_platforms.sh 2>&1 | tee setup.log; then
            grep -n -i -E 'error|because|failed|version solving|requires|exception' setup.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            grep -n -E 'error •' analyze.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi

      - name: Test
        run: |
          export DREC_DOCX_OUT="$PWD/prova.docx"
          set -o pipefail
          if ! flutter test --reporter expanded test/core_test.dart 2>&1 | tee test.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+' test.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Check Word file
        run: |
          pip install -q python-docx
          python3 -c "import docx; d=docx.Document('prova.docx'); t=[p.text for p in d.paragraphs]; print(t); assert 'VERBALE DI ASSEMBLEA DEI SOCI' in t[0]; assert 'A & B <srl>' in t[1]"

      # Le librerie native per Linux servono solo alla prova vera sul server.
      - name: Linux native libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev >/dev/null
          flutter create --platforms=linux . >/dev/null
          set -o pipefail
          if ! flutter build linux --debug 2>&1 | tee linux.log; then
            grep -n -i -E 'error|failed|cmake' linux.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=linux::$(cat err.txt)"
            exit 1
          fi

      - name: Real transcription test
        run: |
          export LD_LIBRARY_PATH="$PWD/build/linux/x64/debug/bundle/lib:${LD_LIBRARY_PATH:-}"
          export DREC_MODELS="$MODELS_DIR"
          set -o pipefail
          if ! flutter test --reporter expanded test/engine_real_test.dart 2>&1 | tee real.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|reason|\.dart [0-9]+:[0-9]+|Invalid|load' real.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=trascrizione::$(cat err.txt)"
            exit 1
          fi
          res=$(grep -o 'DREC_RESULT.*' real.log | tail -1)
          echo "::notice title=trascrizione::$res"

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee build.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|e: file|\.dart:[0-9]+' build.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi

      # Con i secret KS_B64 e KS_PASS la firma resta sempre la stessa.
      # Senza, ogni build usa una chiave nuova usa e getta che non viene salvata.
      - name: Sign APKs
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -o pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          KS=$RUNNER_TEMP/app.jks
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore "$KS" -alias app -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=D. Recorder Lab, C=IT" -storepass "$KS_PASS" -keypass "$KS_PASS"
            echo "::warning title=firma::Chiave temporanea: per aggiornare serve disinstallare la versione precedente."
          fi
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if ! "${BT}apksigner" sign --ks "$KS" --ks-key-alias app \
                --ks-pass env:KS_PASS --key-pass env:KS_PASS "$apk" 2>&1 | tee sign.log; then
              echo "::error title=sign::$(tail -5 sign.log | tr '\n' ' ')"
              exit 1
            fi
            "${BT}apksigner" verify "$apk"
          done
          rm -f "$KS"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Recorder Lab – build ${{ github.run_number }}
          body: |
            Per quasi tutti i telefoni scarica **app-arm64-v8a-release.apk**.
            Telefoni molto vecchi: app-armeabi-v7a-release.apk.
          files: |
            build/app/outputs/flutter-apk/*-release.apk
